<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171B2E"><title>GAMEZAAR Live Preview</title><link rel="stylesheet" href="car-racing.css?v=7"><link rel="stylesheet" href="preview-engine.css?v=1"></head>
<body class="race-page">
<main class="race-main">
<section class="race-shell" id="raceShell">
<div class="race-hud" aria-label="Race information"><div class="hud-stat" aria-label="Coins"><span class="hud-icon" aria-hidden="true">🪙</span><strong id="coins">0000</strong></div><div class="hud-stat" aria-label="Score"><span class="hud-icon" aria-hidden="true">🏆</span><strong id="score">0000</strong></div><div class="hud-stat" aria-label="Best score"><span class="hud-icon" aria-hidden="true">👑</span><strong id="best">0000</strong></div><div class="hud-stat" aria-label="Speed"><span class="hud-icon" aria-hidden="true">🏎️</span><strong id="speed">1.0x</strong></div></div>
<div class="canvas-wrap"><canvas id="game" width="360" height="600" aria-label="Car racing game"></canvas><div class="game-overlay" id="overlay"><div class="overlay-card garage-card"><div class="garage-top"><span class="garage-brand">🏁 GARAGE</span><span class="garage-wallet">🪙 <strong id="garageCoins">0</strong></span></div><h2 id="overlayTitle">Choose your ride</h2><p id="overlayText">Pick a car and hit the road. Collect golden coins placed on the road.</p><div class="garage-showcase"><div class="showcase-bracket"><canvas id="carPreview" width="180" height="150"></canvas></div><div class="showcase-name"><strong id="selectedCarName">Street King</strong><span id="selectedCarStatus">OWNED • READY TO RACE</span></div></div><div class="garage-list-wrap"><div class="garage-list" id="garageList" aria-label="Choose a car"></div></div><p class="garage-message" id="garageMessage" aria-live="polite"></p><button id="startBtn" class="button button-primary garage-action" type="button">START RACE</button></div></div></div>
<div class="race-controls"><button type="button" id="leftBtn" aria-label="Move left">◀</button><span>STEER</span><button type="button" id="rightBtn" aria-label="Move right">▶</button></div>
</section></main>
<script src="player-cars.js?v=1"></script><script src="traffic-cars.js?v=1"></script><script src="garage-cars.js?v=2"></script><script src="preview-engine.js?v=8"></script></body></html>
